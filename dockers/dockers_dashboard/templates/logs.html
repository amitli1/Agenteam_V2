<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logs - {{ container_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #1e1e1e; color: #d4d4d4; }
    .navbar-brand { font-weight: 600; }
    #log-output {
      background-color: #111;
      color: #c9d1d9;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.85rem;
      padding: 1rem;
      height: 80vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border-radius: 6px;
    }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .status-connected { background-color: #198754; }
    .status-disconnected { background-color: #dc3545; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <span class="navbar-brand">🐳 Logs: {{ container_name }}</span>
      <span>
        <span id="status-dot" class="status-dot status-disconnected"></span>
        <span id="status-text" class="text-light small">connecting...</span>
      </span>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="d-flex justify-content-between mb-2">
      <span class="text-muted small">Container ID: {{ container_id }}</span>
      <div>
        <button id="clear-btn" class="btn btn-sm btn-outline-light">Clear</button>
        <button id="autoscroll-btn" class="btn btn-sm btn-outline-light active">Auto-scroll: ON</button>
      </div>
    </div>
    <div id="log-output"></div>
  </div>

  <script>
    const containerId = {{ container_id | tojson }};
    const logOutput = document.getElementById("log-output");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const autoscrollBtn = document.getElementById("autoscroll-btn");
    let autoscroll = true;

    autoscrollBtn.addEventListener("click", () => {
      autoscroll = !autoscroll;
      autoscrollBtn.textContent = "Auto-scroll: " + (autoscroll ? "ON" : "OFF");
      autoscrollBtn.classList.toggle("active", autoscroll);
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      logOutput.textContent = "";
    });

    function appendLine(text) {
      logOutput.textContent += text + "\n";
      if (autoscroll) {
        logOutput.scrollTop = logOutput.scrollHeight;
      }
    }

    function connect() {
      const source = new EventSource(`/stream/${encodeURIComponent(containerId)}`);

      source.addEventListener("open", () => {
        statusDot.classList.remove("status-disconnected");
        statusDot.classList.add("status-connected");
        statusText.textContent = "connected";
      });

      source.onopen = () => {
        statusDot.classList.remove("status-disconnected");
        statusDot.classList.add("status-connected");
        statusText.textContent = "connected";
      };

      source.onmessage = (event) => {
        appendLine(event.data);
      };

      source.onerror = () => {
        statusDot.classList.remove("status-connected");
        statusDot.classList.add("status-disconnected");
        statusText.textContent = "disconnected - retrying...";
        source.close();
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
